name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "public/**"
      - "server.js"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Narrative flow
        run: bun tests/flow.mjs

      - name: Map reachability
        run: bun tests/map.mjs

      - name: Join URL candidates
        run: bun tests/net-urls.mjs

      - name: DOM smoke
        run: bun tests/dom-smoke.mjs

  build-apk:
    name: Debug APK
    needs: test-web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM" || SM="sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          yes | "$SM" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "Using Android SDK at $SDK"
          ls "$SDK/platforms" | tail -5

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ash-and-heather-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
