plugins {
  id "com.android.application"
}

android {
  namespace "ru.ashheather.game"
  compileSdk 34

  defaultConfig {
    applicationId "ru.ashheather.game"
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName "0.2.0"
  }

  buildTypes {
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = "UTF-8"
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }

  buildFeatures {
    buildConfig true
  }

  packagingOptions {
    resources {
      excludes += ["META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt"]
    }
  }
}

def webAssetsRoot = file("$buildDir/generated/web-assets")

def copyWebAssets = tasks.register("copyWebAssets", Copy) {
  from(rootProject.file("../public"))
  into("$webAssetsRoot/www")
}

android.sourceSets.main.assets.srcDirs += [webAssetsRoot]

tasks.named("preBuild").configure {
  dependsOn(copyWebAssets)
}

tasks.matching { it.name == "mergeDebugAssets" || it.name == "mergeReleaseAssets" }.configureEach {
  dependsOn(copyWebAssets)
}

dependencies {
  implementation "org.nanohttpd:nanohttpd:2.3.1"
  implementation "org.java-websocket:Java-WebSocket:1.5.6"
}
